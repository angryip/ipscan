text.gettingStarted=Fittizio

text.gettingStarted1=Angry IP Scanner è uno strumento di scansione indirizzi IP.\n\n\
Viene usato per la scansione di indirizzi IP con l'obiettivo di trovare host online e raccogliere informazioni interessanti su ciascuno di essi.\n\n\
Puoi iniziare specificando gli indirizzi IP da scansionare (il tuo IP locale è inserito per impostazione predefinita) e facendo clic sul pulsante 'Avvia'.

text.gettingStarted2=Terminologia principale:\n\n\
Alimentatore - generatore di indirizzi IP per la scansione.\nAngry IP Scanner fornisce vari tipi di alimnetatori: intervallo IP, casuale e file di elenco IP.\nÈ possibile selezionare un alimentatore usando la casella combinata accanto al pulsante 'Avvia'.\n\n\
Fetcher - raccoglie informazioni specifiche su un host, ad es. tempo di ping, nome host, porte aperte.\nI ftecher di solito rappresentano le colonne nell'elenco dei risultati di scansione.\nÈ possibile selezionare fetchers aggiuntivi scegliendo nel menu 'Strumenti' - > 'Seleziona fetchers'.

text.gettingStarted3=Terminologia principale (continua):\n\n\
Host online - è l'host che risponde al ping.\nQuesti sono blu nell'elenco dei risultati.\n\n\
Hist offline - è l'host che non risponde al ping (rosso nell'elenco).\nTuttavia, potrebbe avere ancora porte aperte (se il firewall blocca i ping).\nPer eseguire la scansione completa di questi host, seleziona in 'Strumenti' -> 'Preferenze' la voce 'scansiona host offline'.\n\n\
Porta aperta - una porta TCP, che risponde alla connessione tentativo.\nGli host con porte aperte sono verdi nell'elenco dei risultati.\n\n\
Porta filtrata - una porta TCP, che non risponde e che è chiusa (nessun pacchetto RST).\nQueste porte sono di solito specificamente bloccate da firewall per qualche motivo.

text.gettingStarted4=Ping (verifica se gli host sono attivi):\n\n\
Angry IP Scanner può usare diversi metodi per il ping degli host.\nÈ possibile scegliere tra di loro nella finestra di dialogo 'Imposatzioni'.\n\n\
ICMP echo - è il metodo standard usato dal programma 'ping'.\nQuesto richiede per la maggior parte delle piattaforme i permessi di amministratore o root.\nNota che alcuni software firewall disabilitano l'invio di pacchetti ICMP echo reply, rendendo gli host online come se fossero offline.\n\n\
UDP - invia pacchetti UDP (datagrammi) a una delle porte dell'host e vede se c'è qualche risposta (positiva o negativa).\nQuesto non è standard, ma funziona senza permessi speciali.\n\n\
TCP - tenta di connettersi alla porta 80 (http) dell'host.\nQuesto può funzionare meglio di UDP per alcune reti, ma di solito è peggio.\n\n\
Il ping UDP e TCP il più delle volte non rilevano correttamente i router o altre apparecchiature di rete.\n\n\
TTL (time to live) - questo fetcher funziona solo con il metodo di ping ICMP.\nIl suo valore iniziale è di solito 64 o 128, e la differenza rappresenta la distanza dall'host in numero di nodi che ha attraversato.

text.gettingStarted5=L'elenco risultati visualizza i risultati della scansione, una riga per ogni indirizzo scansionato.\n\n\
Usando la finestra di dialogo 'Impostazioni', è possibile configurare la visualizzazione di:\n\
- tutti gli host scansionati\n\
- solo gli host online\n\
- solo gli host con una porta aperta\n\n\
Valori speciali (anche confdigurabili):\n\
[n/s] - valore non scansionato - che non è stato scansionato affatto (ad esempio se l'host è offline)\n\
[n/d] - il valore non è disponibile, ma è stato scansionato

text.crippledWindowsInfo=Grazie per aver provato Angry IP Scanner!\n\n\
Tuttavia, tieni presente che le versioni consumer di Windows (ad es. Windows XP SP2/Vista/7) hanno una capacità limitata di essere host per la scansione, a causa del supporto RawSocket rimosso e della velocità di connessione TCP limitare.\n\n\
Per questo motivo, alcune impostazioni sono state modificate, rendendo la scansione più lenta rispetto ad altri sistemi operativi.\n\n\
Per ulteriori informazioni consulta la pagina delle domande frequenti (FAQ) nel sito web (usa il menu Aiuto).
