text.configDetect=Wir werden versuchen die Anzahl an Threads zu erkennen, welche zuverl\u00e4ssig auf dieser Maschine laufen, indem zu einem bekannten Host gleichzeitig vielfach mit dem konfigurierten Port-Timeout zugegriffen wird.\n\nBitte stellen Sie einen Host und Port zur Verf\u00fcgung, der 100% offen ist und funktioniert, z.B. einen Proxy oder Webserver in Ihrem Netzwerk.
