fetcher.ip.info=Wyświetla skanowane adresy IP.\nTen moduł jest wymagany i nie można go usunąć z listy.
fetcher.ping.info=Pokazuje, czy host odpowiada na zapytania ping oraz podaje średni czas w obie strony (RTT) do hosta, jeśli zostanie wykryty (w zależności od metody wybranej w okienku ustawień).
fetcher.ping.ttl.info=Pokazuje wartość TTL (Time To Live) w pakietach odpowiedzi ping (działa tylko dla ICMP).\n\nWartość ta jest domyślnie zmniejszana na każdym węźle sieci przekazującym pakiet. Jeśli więc można oszacować wartość domyślną (zwykle 64, 128 lub 255), wyświetlana jest odległość do hosta (liczba węzłów).
fetcher.packetloss=Utrata pakietów
fetcher.packetloss.info=Pokazuje liczbę utraconych pakietów z całkowitej liczby wysłanych pakietów ping.
fetcher.hostname.info=Pokazuje nazwę hosta ustaloną na podstawie odwrotnego zapytania DNS (Reverse DNS).\n\nJest to nazwa zarejestrowana na serwerze DNS i może różnić się od nazwy skonfigurowanej na samym urządzeniu.
fetcher.ports.info=Wyświetla listę otwartych portów dla skanowanego urządzenia.\n\nPort jest otwarty, gdy możliwe jest pełne uzgodnienie TCP (handshake) i nawiązanie połączenia.\n\nPorty do skanowania można wybrać w oknie ustawień.\n\nLiczba w nagłówku kolumny pokazuje aktualną liczbę portów wybranych do skanowania; znak '+' pojawia się, gdy żądane porty są skanowane dokładnie w ten sposób dla każdego hosta.
fetcher.ports.filtered=Filtrowane porty
fetcher.ports.filtered.info=Pokazuje listę filtrowanych portów na skanowanych urządzeniach.\n\nPort jest filtrowany, gdy w określonym czasie nie otrzymano odpowiedzi na próbę połączenia. Jeśli port jest filtrowany, prawdopodobnie został zablokowany przez zaporę sieciową (firewall).
fetcher.comment=Komentarze
fetcher.comment.info=Pokazuje komentarz wprowadzony dla danego adresu w oknie szczegółów IP.\nKomentarz jest trwały i zostanie ponownie wyświetlony przy ponownym skanowaniu hosta.
fetcher.webDetect=Wykrywanie WWW
fetcher.webDetect.info=Wykrywa nazwę oprogramowania i wersję serwera WWW, jeśli to możliwe.\n\nDziała na podstawie zapytania HEAD i odczytu nagłówka HTTP odpowiedzi.
fetcher.httpSender.info=Wysyła określone zapytania dosłowne na podany port TCP (np. 3128, HTTP Proxy), odbiera odpowiedź i używa określonego wyrażenia regularnego do wyciągnięcia żądanych informacji.\n\nBardzo elastyczny, może być używany dla dowolnego protokołu tekstowego, takiego jak HTTP, SMTP, POP3, IMAP itp. Dla zaawansowanych użytkowników.
fetcher.httpProxy=HTTP Proxy
fetcher.httpProxy.info=Sprawdza, czy na hoście działa działające proxy HTTP – na porcie 3128, dowolnym skanowanym otwartym porcie lub żądanym porcie załadowanym z pliku w formacie host:port.
fetcher.portText.custom=Niestandardowy
fetcher.netbios.info=Pobiera informacje NetBIOS z komputerów z systemem Windows.\n\nOdpowiedź ma następujący format:\nDOMENA\\UŻYTKOWNIK@KOMPUTER [MAC]\n\nGdzie:\nDOMENA - domena Windows lub grupa robocza\nUŻYTKOWNIK - aktualnie zalogowany użytkownik\nKOMPUTER - nazwa komputera Windows (może być inna niż nazwa DNS)\nNiektóre elementy mogą być nieobecne w zależności od odpowiedzi.\n\nNie działa to z komputerami mającymi włączoną zaporę sieciową (większość nowoczesnych konfiguracji).\nTen moduł istnieje głównie w celu zapewnienia kompatybilności z wersją 2.x.
fetcher.mac=Adres MAC
fetcher.mac.info=Rozwiązuje adres MAC hosta za pomocą protokołu ARP.\nNie działa w sieciach innych niż lokalne.
fetcher.mac.vendor=Producent MAC
fetcher.mac.vendor.info=Pokazuje nazwę producenta, który prawdopodobnie wyprodukował kartę sieciową o rozkodowanym adresie MAC.
fetcher.mac.separator=Separator adresów MAC
