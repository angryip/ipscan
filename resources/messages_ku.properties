exception.OutOfMemoryError=بیرگە تەواو بوو. بڕی بیرگەی بەردەست بۆ بەرنامەکە تێپەڕێنراوە.\nتکایە زۆرترین قەبارەی بیرگە بۆ ئەم بەرنامەیە زیاد بکە.
text.gettingStarted1=Angry IP Scanner ئامرازێکی سکانەری ناونیشانی IP یە.\n\nبۆ سکانکردنی ناونیشانی ئایپی بەکاردێت بە ئامانجی دۆزینەوەی هۆستی زیندوو و کۆکردنەوەی زانیاری سەرنجڕاکێش لەسەر هەریەکەیان.\n\nدەتوانیت بە دیاریکردنی ناونیشانی IP بۆ سکانکردن دەستپێبکەیت (IP ناوخۆییەکەت بە شێوازی پێشوەختە داخڵ کراوە) و کرتەکردن لەسەر دوگمەی دەستپێکردن.
text.gettingStarted2=زاراوەی سەرەکی:\n\nفیدەر - مۆلیدەی ناونیشانی IP بۆ سکانکردن. Angry IP Scanner جۆرەها فیدەر دابین دەکات: مەودای IP، هەڕەمەکی، و پەڕگەی لیستی IP. دەتوانیت بە بەکارهێنانی بۆکسی کۆمبۆی تەنیشت دوگمەی دەستپێکردن فیدەرێک هەڵبژێریت.\n\nFetcher - زانیاری تایبەت سەبارەت بە هۆستێک کۆدەکاتەوە، بۆ نموونە. کاتی ping، ناوی هۆست، دەروازە کراوەکان. بەزۆری فیتچەرەکان نوێنەرایەتی ستوونەکان دەکەن لە لیستی ئەنجامەکانی سکانکردندا. دەتوانیت هێنانی زیادە هەڵبژێریت بە هەڵبژاردنی "ئامرازەکان->وەرگرەکان هەڵبژێرە" لە مینیوەکەدا.
text.gettingStarted3=زاراوەی سەرەکی (بەردەوامە):\n\nمیوانداری زیندوو - میواندارە، وەڵامی pingکردن دەداتەوە. ئەمانە لە لیستی ئەنجامەکاندا شینن.\n\nهۆستی مردوو - هۆستەکەیە، وەڵامی پینگ ناداتەوە (سوور لە لیستەکەدا). بەڵام لەوانەیە هێشتا دەروازەکانی کراوە بێت (ئەگەر دیواری ئاگرکوژێنەوە pingەکان بلۆک بکات). بۆ ئەوەی ئەم هۆستانە بە تەواوی سکان بکەیت، لە دیالۆگی Tools->Preferences "scan dead hosts" هەڵبژێرە.\n\nدەرچەی کراوە - دەروازەیەکی TCP، وەڵامدانەوەی هەوڵەکانی پەیوەندیکردن. ئەو هۆستانەی کە دەرچەی کراوەیان هەیە لە لیستی ئەنجامەکاندا سەوزن.\n\nدەرچەی فلتەرکراو - دەروازەیەکی TCP، وەڵام ناداتەوە کە داخراوە (بێ پاکەتێکی RST). ئەم دەروازانە بەزۆری بە تایبەتی لەلایەن دیواری ئاگرەوە بە هۆکارێکەوە بلۆک دەکرێن.
text.gettingStarted4=پینگکردن (پشکنینی ئەوەی کە ئایا هۆستەکان لە ژیاندان):\n\nAngry IP Scanner دەتوانێت ڕێگەی جیاواز بۆ پینگکردنی هۆستەکان بەکاربهێنێت. دەتوانیت لە دیالۆگی هەڵبژاردنەکاندا لە نێوانیاندا هەڵبژێریت.\n\nICMP echo - شێوازێکی ستانداردە کە لەلایەن بەرنامەی 'ping' بەکاردەهێنرێت. ئەم یەکەیان پێویستی بە ئیمتیازاتی بەڕێوەبەر یان ڕوت هەیە لە زۆربەی پلاتفۆرمەکاندا. سەرنج بدە کە هەندێک لە نەرمەکاڵاکانی دیواری ئاگر ناردنی پاکێتی وەڵامی دەنگدانەوەی ICMP لەکاردەخەن، ئەمەش وا دەکات هۆستەکانی زیندوو وەک مردوو دەرکەون.\n\nUDP - پاکەتەکانی UDP (داتاگرام) دەنێرێت بۆ یەکێک لە دەروازەکانی هۆستەکە و دەبینێت ئایا هیچ وەڵامێک هەیە (یان ئەرێنی یان نەرێنی). ئەمە ناستانداردە، بەڵام بەبێ ئیمتیازاتی تایبەت کاردەکات.\n\nTCP - هەوڵدەدات پەیوەندی بە دەرچەی 80 (http) لەسەر هۆستەکە بکات. ڕەنگە ئەمە بۆ هەندێک تۆڕ باشتر لە UDP کار بکات، بەڵام بەزۆری خراپترە.\n\nزۆرترین جار pingکردنی UDP و TCP بە باشی ڕاوتەرەکان یان ئامێرەکانی تری تۆڕەکە دەستنیشان ناکات.\n\nTTL (کاتی ژیان) - ئەم فیچەرە تەنها بە شێوازی pinging ICMP کاردەکات. بەهای سەرەتایی بەزۆری ٦٤ یان ١٢٨ یە و جیاوازییەکە مەودای خانەخوێیەکە لە ژمارەی ئەو گرێیانەی کە بەسەریدا تێپەڕیوە نیشان دەدات.
text.gettingStarted5=لیستی ئەنجامەکان ئەنجامەکانی سکانکردن پیشان دەدات، یەک دێڕ بۆ هەر ناونیشانێکی سکانکراو.\n\nبە بەکارهێنانی دیالۆگی هەڵبژاردنەکان، دەتوانیت ڕێکبخەیت بۆ ئەوەی پیشان بدەیت:\n- هەموو هۆستەکانی سکانکراو\n- تەنها هۆستەکانی زیندوو\n- تەنها ئەو هۆستانەی کە هەر دەروازەیەکیان کراوە بێت\n\nبەها تایبەتەکان (هەروەها دەتوانرێت ڕێکبخرێت):\n[n/s] - بەهایەکی سکان نەکراو کە بە هیچ شێوەیەک سکان نەکراوە (بۆ نموونە ئەگەر هۆستەکە مردبێت)\n[n/a] - بەهاکە بەردەست نییە، بەڵام سکان کراوە
text.crippledWindowsInfo=سوپاس بۆ هەوڵدانت Angry IP Scanner!\n\nبەڵام لەبیرت بێت کە وەشانی بەکاربەری ویندۆز (بۆ نموونە ویندۆز ئێکس پی SP2 / ڤیستا / 7) توانای سنوورداریان هەیە بۆ بوون بە هۆست بۆ سکانکردن، بەهۆی لابردنی پشتگیری RawSocket و سنووردارکردنی ڕێژەی پەیوەندی TCP.\n\nبەهۆی ئەوەوە هەندێک هەڵبژاردن بۆ تۆ گۆڕدرا، ئەمەش وایکرد سکانکردن خاوتر بێت لە چاو سیستەمی کارپێکردنی تر.\n\nبۆ زانیاری زیاتر سەیری لاپەڕەی پرسیارە بەردەوامەکان بکە لە ماڵپەڕەکەدا (مێنۆی یارمەتی بەکاربهێنە).
