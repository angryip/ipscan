fetcher.ping.ttl.info=بەهای TTL (Time To Live) لە پاکەتەکانی وەڵامی ping نیشان دەدات (تەنها لەگەڵ pinging ICMP کاردەکات).\n\nئەم بەهایە بەزۆری لەلایەن هەر گرێیەک لە تۆڕەکەدا کەم دەکرێتەوە کە پاکەتەکە دەنێرێت، بۆیە ئەگەر بەهای سەرەتایی پێشبینیکراو بێت (بەزۆری ٦٤، ١٢٨، یان ٢٥٥)، ئەوا جیاوازییەکە مەودای هۆستەکە نیشان دەدات (بە ژمارەی گرێکان).
fetcher.hostname.info=ناوی هۆستی هۆستەکە نیشان دەدات کە بەهۆی گەڕانی DNSی پێچەوانە بەدەست هاتووە.\n\nئەمە ناوی هۆستی تۆمارکراوە لەسەر سێرڤەری DNS و لەوانەیە جیاواز بێت لە ناوی هۆست کە لەسەر خودی ئامێرەکە ڕێکخراوە.
fetcher.ports.info=لیستی دەروازە کراوەکان پیشان دەدات لەوانەی کە سکان کراون.\n\nدەروازەیەک کاتێک کراوە دەبێت کە بتوانرێت دەستگرتنی TCP لەگەڵیدا تەواو بکرێت و پەیوەندییەک دروست بکرێت.\nدەتوانیت لە دیالۆگی هەڵبژاردنەکاندا دەروازە سکانکراوەکان هەڵبژێریت.\n\nژمارەی ناو سەردێڕی ستوونی ژمارەی ئێستای دەروازە هەڵبژێردراوەکان بۆ سکانکردن نیشان دەدات؛ '+' پیشان دەدرێت ئەگەر دەروازە داواکراوەکان بۆ هەر هۆستێک بە هەمان شێوە سکان بکرێن.
fetcher.ports.filtered=دەروازە فلتەرکراوەکان
fetcher.ports.filtered.info=لیستی دەروازە فلتەرکراوەکان پیشان دەدات لەوانەی کە سکان کراون.\n\nدەروازەیەک کاتێک فلتەر دەکرێت کە هیچ وەڵامێک بۆ هەوڵی پەیوەندیکردن لە ماوەی دیاریکراودا وەرنەگیرێت. ئەگەر دەروازەیەک فلتەر کرابێت، ئەوا بە ئەگەرێکی زۆرەوە لەلایەن دیواری ئاگرەوە بلۆک کراوە.
fetcher.comment.info=ئەو سەرنجانە پیشان دەدات کە بۆ ناونیشانەکە داخڵ کراون بە بەکارهێنانی پەنجەرەی IP Details.\nکۆمێنتەکان بەردەوامن و کاتێک ئەم هۆستە دووبارە سکان دەکرێتەوە پیشان دەدرێن.
fetcher.webDetect.info=ناو و وەشانی نەرمەکاڵای وێب سێرڤەرەکە دەدۆزێتەوە، ئەگەر بتوانرێت.\n\nبە ناردنی داواکاری HEAD و خوێندنەوەی سەردێڕی Server HTTP لە وەڵامەکەوە کاردەکات.
fetcher.httpProxy=پرۆکسی HTTP
fetcher.portText.custom=بە خواستی خۆت
fetcher.netbios.info=زانیارییەکانی NetBIOS سەبارەت بە ئامێرەکانی ویندۆز وەردەگرێتەوە.\n\nوەڵامەکە بەم شێوەیەی خوارەوەیە:\nدۆمەین\\بەکارهێنەر@کۆمپیوتەر [MAC]\n\nلە کوێ:\nDOMAIN - دۆمەین یان گروپی کاری ویندۆز\nUSER - لە ئێستادا بەکارهێنەرێکی چوونەژوورەوە\nکۆمپیوتەر - ناوی کۆمپیوتەری ویندۆز (ڕەنگە جیاواز بێت لە ناوی DNS)\nڕەنگە هەندێک بەش نەبن، بەپێی وەڵامەکە.\n\nتێبینی بکە ئەمە لەگەڵ ئەو ئامێرانەدا کارناکات کە دیواری ئاگریان چالاک کردووە (کە زۆربەی دامەزراندنە مۆدێرنەکانن).\nئەم فیچەرە زیاتر بۆ گونجاوی تایبەتمەندی لەگەڵ وەشانی 2.x دابین کراوە.
fetcher.mac=ناونیشانی MAC
fetcher.mac.info=ناونیشانی MAC ی هۆست لەسەر تۆڕی ناوخۆیی بە بەکارهێنانی پرۆتۆکۆڵی ARP چارەسەر دەکات.\nبۆ هۆستەکانی تۆڕی ناخۆجێی کارناکات.
fetcher.mac.vendor=فرۆشیاری MAC
fetcher.mac.vendor.info=ناوی فرۆشیار نیشان دەدات کە لەوانەیە کارتی تۆڕەکەی بەرهەم هێنابێت لەگەڵ ناونیشانی MAC چارەسەرکراو.
