preferences.ports.portsDescription=لێرەدا دەروازەکان دیاری بکە بۆ سکانکردن. مەوداکان پشتگیری دەکرێن.\nنموونە: 1-3،5،7،10-15،6000-6100\nئەگەر زۆر دەروازە دیاری کرابێت، سکانکردن دەتوانێت کاتێکی زۆری بخایەنێت.
preferences.ports.addRequested.info=لەوانەیە فیدەرەکان پشتگیری لە دیاریکردنی دەروازە داواکراوەکان بکەن جگە لە ناونیشانەکان (بۆ نموونە فیدەری پەڕگە، لە شێوەی ناونیشان:دەروازە)\nئەمە ڕێگە بە دووبارە سکانکردنەوەی فایلەکانی لیستی IP:Port ی هەناردەکراو دەدات. دەتوانێت بۆ لیستە پرۆکسییەکانی HTTP و ئەو جۆرە شتانە بەسوود بێت.\nپشکنینی ئەمە هەمیشە دەروازە داواکراوەکانی هەر هۆستێک دەسکان دەکات جگە لەو دەروازە باوانەی کە لە سەرەوە دیاریکراون.
