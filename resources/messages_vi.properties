fetcher.ip=IP
fetcher.ip.info=Hiển thị địa chỉ IP đã quét.\nTrình lấy dữ liệu này là bắt buộc và không thể xóa khỏi danh sách.
fetcher.ping=Ping
fetcher.ping.info=Cho biết máy chủ có trả lời yêu cầu ping hay không và hiển thị thời gian khứ hồi trung bình của gói tin đến máy chủ và quay về nếu phát hiện được (tùy thuộc vào phương thức ping được chọn trong hộp thoại Tùy chọn).
fetcher.ping.ttl=TTL
fetcher.ping.ttl.info=Hiển thị giá trị TTL (Time To Live) trong các gói phản hồi ping (chỉ hoạt động với ping ICMP).\n\nGiá trị này thường bị giảm đi tại mỗi nút mạng chuyển tiếp gói tin, vì vậy nếu có thể đoán được giá trị ban đầu (thường là 64, 128 hoặc 255) thì phần chênh lệch cho biết khoảng cách đến máy chủ (tính bằng số nút).
fetcher.packetloss=Mất gói
fetcher.packetloss.info=Hiển thị số gói bị mất trên tổng số gói ping đã gửi.
fetcher.hostname=Tên máy chủ
fetcher.hostname.info=Hiển thị tên máy chủ thu được qua tra cứu DNS ngược.\n\nĐây là tên máy chủ được đăng ký trên máy chủ DNS và có thể khác với tên máy được cấu hình trên chính máy đó.
fetcher.ports=Cổng
fetcher.ports.info=Hiển thị danh sách các cổng mở trong số các cổng đã quét.\n\nMột cổng được coi là mở khi có thể hoàn tất bắt tay TCP và thiết lập kết nối với cổng đó.\nBạn có thể chọn các cổng cần quét trong hộp thoại Tùy chọn.\n\nCon số trong tiêu đề cột cho biết số cổng hiện được chọn để quét; dấu '+' xuất hiện nếu các cổng được yêu cầu cho từng máy chủ cũng được quét.
fetcher.ports.filtered=Cổng bị lọc
fetcher.ports.filtered.info=Hiển thị danh sách các cổng bị lọc trong số các cổng đã quét.\n\nMột cổng bị lọc khi không nhận được phản hồi nào cho yêu cầu kết nối trong khoảng thời gian quy định. Nếu một cổng bị lọc thì có thể nó đã bị tường lửa chặn.
fetcher.comment=Ghi chú
fetcher.comment.info=Hiển thị ghi chú đã nhập cho địa chỉ này trong cửa sổ Chi tiết IP.\nCác ghi chú được lưu lại và hiển thị khi máy chủ này được quét lại.
fetcher.webDetect=Nhận diện web
fetcher.webDetect.info=Nhận diện tên và phiên bản phần mềm máy chủ web, nếu có thể.\n\nHoạt động bằng cách gửi yêu cầu HEAD và đọc tiêu đề HTTP Server trong phản hồi.
fetcher.httpSender=Trình gửi HTTP
fetcher.httpSender.info=Gửi các yêu cầu dạng văn bản đã chỉ định tới cổng TCP đã chỉ định (ví dụ: 80), nhận phản hồi và dùng biểu thức chính quy đã chỉ định để trích xuất thông tin cần thiết.\n\nCó thể tùy biến cao, dùng được cho mọi giao thức dạng văn bản như HTTP, SMTP, POP3, IMAP, v.v. Dành cho người dùng nâng cao.
fetcher.httpProxy=Proxy HTTP
fetcher.httpProxy.info=Phát hiện xem có proxy HTTP đang hoạt động trên máy chủ hay không, ở cổng 3128, ở bất kỳ cổng mở nào đã quét, hoặc ở cổng được yêu cầu được tải bằng nguồn địa chỉ Tệp văn bản theo định dạng host:port.
fetcher.portText.custom=Tùy chỉnh
fetcher.netbios=Thông tin NetBIOS
fetcher.netbios.info=Lấy thông tin NetBIOS về các máy Windows.\n\nPhản hồi có định dạng sau:\nDOMAIN\\USER@COMPUTER [MAC]\n\nTrong đó:\nDOMAIN - miền hoặc nhóm làm việc Windows\nUSER - người dùng hiện đang đăng nhập\nCOMPUTER - tên máy tính Windows (có thể khác với tên DNS)\nMột số phần có thể không có, tùy thuộc vào phản hồi.\n\nLưu ý rằng tính năng này sẽ không hoạt động với các máy đã bật tường lửa (hầu hết các bản cài đặt hiện đại).\nTrình lấy dữ liệu này chủ yếu được cung cấp để tương thích tính năng với phiên bản 2.x.
fetcher.mac=Địa chỉ MAC
fetcher.mac.info=Phân giải địa chỉ MAC của máy chủ trong mạng cục bộ bằng giao thức ARP.\nKhông hoạt động với các máy chủ không thuộc mạng cục bộ.
fetcher.mac.vendor=Nhà sản xuất MAC
fetcher.mac.vendor.info=Hiển thị tên hãng có thể đã sản xuất card mạng mang địa chỉ MAC đã phân giải.
fetcher.mac.separator=Dấu phân cách địa chỉ MAC
