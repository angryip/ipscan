preferences.ports.ports=Chọn cổng
preferences.ports.portsDescription=Chỉ định các cổng cần quét tại đây. Hỗ trợ dải cổng.\nVí dụ: 1-3,5,7,10-15,6000-6100\nNếu chỉ định nhiều cổng, quá trình quét có thể mất nhiều thời gian.
preferences.ports.addRequested=Với mỗi máy chủ, thêm các cổng được yêu cầu từ nguồn địa chỉ Tệp văn bản
preferences.ports.addRequested.info=Nguồn địa chỉ có thể hỗ trợ chỉ định cổng được yêu cầu bên cạnh địa chỉ (ví dụ: nguồn địa chỉ Tệp văn bản, dưới dạng address:port)\nĐiều này cho phép quét lại các tệp danh sách IP:cổng đã xuất. Có thể hữu ích cho danh sách proxy HTTP và các trường hợp tương tự.\nKhi chọn mục này, các cổng được yêu cầu của mỗi máy chủ sẽ luôn được quét cùng với các cổng thông dụng được chỉ định ở trên.
