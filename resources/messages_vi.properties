text.gettingStarted=Nội dung giả

text.gettingStarted1=Angry IP Scanner là công cụ quét địa chỉ IP.\n\n\
Công cụ này dùng để quét các địa chỉ IP nhằm tìm ra các máy chủ (host) đang hoạt động và thu thập thông tin đáng chú ý về từng máy chủ.\n\n\
Bạn có thể bắt đầu bằng cách chỉ định các địa chỉ IP cần quét (mặc định là IP cục bộ của bạn) rồi nhấn nút Bắt đầu.

text.gettingStarted2=Thuật ngữ chính:\n\n\
Nguồn địa chỉ (feeder) - bộ tạo địa chỉ IP để quét. Angry IP Scanner cung cấp nhiều loại nguồn địa chỉ: Dải IP, Ngẫu nhiên và Tệp danh sách IP. Bạn có thể chọn nguồn địa chỉ bằng hộp chọn bên cạnh nút Bắt đầu.\n\n\
Trình lấy dữ liệu (fetcher) - thu thập thông tin cụ thể về một máy chủ, ví dụ: thời gian ping, tên máy chủ, cổng mở. Mỗi trình lấy dữ liệu thường tương ứng với một cột trong danh sách kết quả quét. Bạn có thể chọn thêm trình lấy dữ liệu bằng cách chọn “Công cụ->Trình lấy dữ liệu” trên menu.

text.gettingStarted3=Thuật ngữ chính (tiếp theo):\n\n\
Máy chủ đang hoạt động - là máy chủ có phản hồi ping. Các máy chủ này có màu xanh lam trong danh sách kết quả.\n\n\
Máy chủ không phản hồi - là máy chủ không phản hồi ping (màu đỏ trong danh sách). Tuy nhiên, máy chủ đó vẫn có thể có cổng mở (nếu tường lửa chặn ping). Để quét đầy đủ các máy chủ này, hãy chọn “Quét cả máy chủ không phản hồi ping” trong hộp thoại Công cụ->Tùy chọn.\n\n\
Cổng mở - là cổng TCP có phản hồi các yêu cầu kết nối. Các máy chủ có cổng mở có màu xanh lục trong danh sách kết quả.\n\n\
Cổng bị lọc - là cổng TCP không phản hồi rằng nó đang đóng (không có gói RST). Các cổng này thường bị tường lửa chặn có chủ đích vì lý do nào đó.

text.gettingStarted4=Ping (kiểm tra xem máy chủ có đang hoạt động không):\n\n\
Angry IP Scanner có thể dùng nhiều phương thức khác nhau để ping máy chủ. Bạn có thể chọn phương thức trong hộp thoại Tùy chọn.\n\n\
ICMP echo - là phương thức tiêu chuẩn được chương trình “ping” sử dụng. Phương thức này cần quyền quản trị viên hoặc quyền root trên hầu hết các nền tảng. Lưu ý rằng một số phần mềm tường lửa chặn việc gửi gói ICMP echo reply, khiến các máy chủ đang hoạt động trông như không phản hồi.\n\n\
UDP - gửi gói UDP (datagram) tới một trong các cổng của máy chủ và xem có phản hồi nào không (tích cực hoặc tiêu cực). Đây là phương thức không chuẩn nhưng hoạt động mà không cần quyền đặc biệt.\n\n\
TCP - thử kết nối tới cổng 80 (http) trên máy chủ. Với một số mạng, phương thức này có thể hoạt động tốt hơn UDP, nhưng thường thì kém hơn.\n\n\
Ping bằng UDP và TCP thường không phát hiện chính xác bộ định tuyến hoặc các thiết bị mạng khác.\n\n\
TTL (time to live) - trình lấy dữ liệu này chỉ hoạt động với phương thức ping ICMP. Giá trị ban đầu của nó thường là 64 hoặc 128, và phần chênh lệch thể hiện khoảng cách đến máy chủ tính bằng số nút mà gói tin đã đi qua.

text.gettingStarted5=Danh sách kết quả hiển thị kết quả quét, mỗi địa chỉ đã quét trên một dòng.\n\n\
Trong hộp thoại Tùy chọn, bạn có thể cấu hình để hiển thị:\n\
- tất cả máy chủ đã quét\n\
- chỉ máy chủ đang hoạt động\n\
- chỉ máy chủ có cổng mở\n\n\
Các giá trị đặc biệt (cũng có thể cấu hình):\n\
[chưa quét] - giá trị hoàn toàn chưa được quét (ví dụ: nếu máy chủ không phản hồi)\n\
[không có] - giá trị không có sẵn, dù đã được quét

text.crippledWindowsInfo=Cảm ơn bạn đã dùng thử Angry IP Scanner!\n\n\
Tuy nhiên, hãy lưu ý rằng các phiên bản Windows dành cho người dùng phổ thông (ví dụ: Windows XP SP2 / Vista / 7) bị hạn chế khả năng làm máy quét, do đã loại bỏ hỗ trợ RawSocket và giới hạn tốc độ kết nối TCP.\n\n\
Vì vậy, một số tùy chọn đã được thay đổi cho bạn, khiến việc quét chậm hơn so với trên các hệ điều hành khác.\n\n\
Xem trang Câu hỏi thường gặp trên trang web (dùng menu Trợ giúp) để biết thêm thông tin.
