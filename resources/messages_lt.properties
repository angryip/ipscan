fetcher.ip.info=Rodo nuskaitytą IP adresą.\nŠi gavimo priemonė yra privaloma ir negali būti pašalinta iš sąrašo.
fetcher.ping.info=Rodo, ar pagrindinis kompiuteris atsako į ping užklausas, ir rodo vidutinį paketo perdavimo pirmyn ir atgal laiką iki pagrindinio kompiuterio ir atgal, jei jis buvo aptiktas (atsižvelgiant į dialogo lange Parinktys pasirinktą ping metodą).
fetcher.ping.ttl.info=Rodo TTL (Time To Live) reikšmę ping atsakymo paketuose (veikia tik su ICMP ping).\n\nŠią reikšmę paprastai sumažina kiekvienas tinklo mazgas, kuris perduoda paketą, taigi, jei pradinė vertė yra atspėjama (paprastai 64, 128 arba 255), skirtumas parodo atstumą iki pagrindinio kompiuterio (mazgų skaičiumi).
fetcher.hostname=Pagrindinio kompiuterio pavadinimas
fetcher.hostname.info=Rodo pagrindinio kompiuterio pavadinimą, gautą atliekant atvirkštinę DNS paiešką.\n\nTai yra DNS serverio registruotas pagrindinio kompiuterio pavadinimas ir gali skirtis nuo pagrindinio kompiuterio pavadinimo, sukonfigūruoto pačiame įrenginyje.
fetcher.ports=Prievadai
fetcher.ports.info=Rodo atidarytų prievadų sąrašą iš tų, kurie buvo nuskaityti.\n\nPrievadas yra atidarytas, kai su juo galima užbaigti TCP rankos paspaudimą ir užmegzti ryšį.\nNuskaitytus prievadus galite pasirinkti dialogo lange Nuostatos.\n\nSkaičius stulpelio antraštėje rodo dabartinį nuskaitymui pasirinktų prievadų skaičių; „+“ rodomas, jei taip pat nuskaitomi kiekvieno pagrindinio kompiuterio prašomi prievadai.
fetcher.ports.filtered=Filtruoti prievadai
fetcher.ports.filtered.info=Rodo filtruotų prievadų sąrašą iš tų, kurie buvo nuskaityti.\n\nPrievadas filtruojamas, kai per nurodytą laiką negaunamas atsakymas į bandymą prisijungti. Jei prievadas filtruojamas, greičiausiai jį užblokavo ugniasienė.
fetcher.comment=Komentarai
fetcher.comment.info=Rodo komentarus, įvestus adresui naudojant IP informacijos langą.\nKomentarai išlieka ir rodomi, kai šis pagrindinis kompiuteris nuskaitomas dar kartą.
fetcher.webDetect=Web aptikimas
fetcher.webDetect.info=Jei įmanoma, aptinka žiniatinklio serverio programinės įrangos pavadinimą ir versiją.\n\nVeikia siunčiant HEAD užklausą ir nuskaitant serverio HTTP antraštę iš atsakymo.
fetcher.httpSender=HTTP siuntėjas
fetcher.httpProxy=HTTP tarpinis serveris
fetcher.portText.custom=Pasirinktinis
fetcher.netbios=NetBIOS informacija
fetcher.netbios.info=Nuskaito NetBIOS informaciją apie Windows įrenginius.\n\nAtsakymas pateikiamas tokiu formatu:\nDOMENAS\\VARTOTOJAS@COMPUTER [MAC]\n\nKur:\nDOMAIN – Windows domenas arba darbo grupė\nUSER – šiuo metu prisijungęs vartotojas\nKOMPIUTERIS – „Windows“ kompiuterio pavadinimas (gali skirtis nuo DNS pavadinimo)\nPriklausomai nuo atsakymo, kai kurių dalių gali nebūti.\n\nAtminkite, kad tai neveiks įrenginiuose, kuriuose įjungta ugniasienė (tai yra dauguma šiuolaikinių įrenginių).\nŠis paėmimo priemonė daugiausia skirta funkcijų suderinamumui su 2.x versija.
fetcher.mac=MAC adresas
fetcher.mac.info=Išsprendžia pagrindinio kompiuterio MAC adresą vietiniame tinkle naudojant ARP protokolą.\nNeveiks ne vietinio tinklo pagrindiniams kompiuteriams.
