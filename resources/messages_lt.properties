exception.OutOfMemoryError=Baigėsi atmintis. Viršytas programos krūvos atminties kiekis.\nPadidinkite maksimalų šios programos krūvos dydį.
text.gettingStarted1=Angry IP Scanner yra IP adresų skaitytuvo įrankis.\n\nJis naudojamas IP adresams nuskaityti, siekiant surasti gyvus pagrindinius kompiuterius ir surinkti įdomios informacijos apie kiekvieną iš jų.\n\nGalite pradėti nurodydami nuskaitytinus IP adresus (pagal numatytuosius nustatymus įvedamas vietinis IP) ir spustelėdami mygtuką Pradėti.
text.gettingStarted2=Pagrindinė terminija:\n\nFeeder - IP adresų generatorius nuskaitymui. Angry IP Scanner teikia įvairių tipų tiektuvus: IP diapazoną, atsitiktinį ir IP sąrašo failą. Galite pasirinkti tiektuvą naudodami šalia mygtuko Pradėti esantį kombinuotąjį laukelį.\n\n„Fetcher“ – renka konkrečią informaciją apie pagrindinį kompiuterį, pvz. ping laikas, pagrindinio kompiuterio pavadinimas, atidaryti prievadai. Gauntuvai paprastai nurodo stulpelius nuskaitymo rezultatų sąraše. Galite pasirinkti papildomus nešiklius meniu pasirinkę „Įrankiai->Pasirinkti nešiklius“.
text.gettingStarted3=Pagrindinė terminija (tęsinys):\n\nGyvas hostas – tai hostas, kuris atsako į pingavimą. Rezultatų sąraše jie yra mėlyni.\n\nMirusis hostas – tai hostas, kuris neatsako į pingavimą (sąraše raudona spalva). Tačiau jame vis tiek gali būti atviri prievadai (jei ugniasienė blokuoja ping). Norėdami visiškai nuskaityti šiuos pagrindinius kompiuterius, dialogo lange Įrankiai->Nuostatos pažymėkite "nuskaityti mirusius pagrindinius kompiuterius".\n\nAtviras prievadas – TCP prievadas, reaguojantis į bandymus prisijungti. Kompiuteriai su atvirais prievadais rezultatų sąraše yra žali.\n\nFiltruotas prievadas – TCP prievadas, neatsako, kad jis uždarytas (nėra RST paketo). Šiuos prievadus dėl kokių nors priežasčių paprastai blokuoja ugniasienės.
text.gettingStarted4=Pingimas (tikrinama, ar šeimininkai gyvi):\n\nAngry IP Scanner gali naudoti skirtingus metodus hostų pingavimui. Galite pasirinkti vieną iš jų dialogo lange Parinktys.\n\nICMP echo – tai standartinis metodas, naudojamas „ping“ programoje. Daugumoje platformų tam reikia administratoriaus arba root teisių. Atminkite, kad kai kuri užkardos programinė įranga neleidžia siųsti ICMP aido atsakymų paketų, todėl gyvi kompiuteriai atrodo kaip mirę.\n\nUDP – siunčia UDP paketus (datagramas) į vieną iš pagrindinio kompiuterio prievadų ir žiūri, ar yra atsakymas (teigiamas ar neigiamas). Tai nestandartinė, tačiau veikia be ypatingų privilegijų.\n\nTCP – bando prisijungti prie pagrindinio kompiuterio 80 prievado (http). Kai kuriuose tinkluose tai gali veikti geriau nei UDP, tačiau dažniausiai tai yra blogiau.\n\nUDP ir TCP ping dažniausiai tinkamai neaptinka maršrutizatorių ar kitos tinklo įrangos.\n\nTTL (laikas gyventi) – šis gavimas veikia tik su ICMP pingo metodu. Jo pradinė vertė paprastai yra 64 arba 128, o skirtumas parodo atstumą iki pagrindinio kompiuterio pagal jo nukeliautų mazgų skaičių.
text.gettingStarted5=Rezultatų sąraše rodomi nuskaitymo rezultatai, po vieną eilutę kiekvienam nuskaitytam adresui.\n\nNaudodami dialogo langą Parinktys galite sukonfigūruoti, kad būtų rodoma:\n- visi nuskaityti pagrindiniai kompiuteriai\n- tik gyvi šeimininkai\n- tik prievadai, kurių prievadai yra atidaryti\n\nSpecialios reikšmės (taip pat konfigūruojamos):\n[n/s] – nenuskaityta vertė, kuri iš viso nebuvo nuskaityta (pvz., jei pagrindinis kompiuteris negyvas)\n[n/a] – vertė nepasiekiama, bet buvo nuskaityta
text.crippledWindowsInfo=Dėkojame, kad bandėte Angry IP Scanner!\n\nTačiau atminkite, kad vartotojams skirtos „Windows“ versijos (pvz., „Windows XP SP2“ / „Vista“ / 7) turi ribotą galimybę būti nuskaitymo prieglobomis dėl pašalinto „RawSocket“ palaikymo ir TCP ryšio greičio apribojimo.\n\nDėl to kai kurios nuostatos buvo pakeistos, todėl nuskaitymas buvo lėtesnis nei kitose operacinėse sistemose.\n\nDaugiau informacijos rasite svetainės DUK puslapyje (naudokite meniu Pagalba).
