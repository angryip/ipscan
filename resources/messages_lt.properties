text.configDetect=Bandysime aptikti gijų, kurios patikimai veikia šiame įrenginyje, skaičių prisijungę prie žinomo pagrindinio kompiuterio daug kartų vienu metu, naudodami sukonfigūruotą prievado skirtąjį laiką.\n\nPateikite pagrindinį kompiuterį ir prievadą, kuris yra 100% atidarytas ir veikia, pvz. tarpinis serveris arba žiniatinklio serveris jūsų tinkle.
text.configDetect.failed=Iš viso buvo bandoma prisijungti %d. Buvo tikimasi, kad %d pasiseks, tačiau iš tikrųjų veikė tik %d. Atrodo, kad jums tikriausiai reikia nustatyti mažesnį maksimalų gijų skaičių arba padidinti prisijungimo skirtąjį laiką.
text.openers.hintText=Vykdymo eilutėje galite naudoti bet kokias nuskaitytas reikšmes, kurias padavėjai grąžino.\n\nŠiuo metu galima pakeisti šiuos paėmimo įrenginius:
