preferences.ports.addRequested.info=Tiektuvai gali palaikyti ne tik adresų, bet ir prašomų prievadų nurodymą (pvz., failų tiektuvas, forma adresas:portas)\nTai leidžia iš naujo nuskaityti eksportuotus IP:Port sąrašo failus. Gali būti naudinga HTTP tarpinio serverio sąrašams ir pan.\nPažymėjus tai, be anksčiau nurodytų bendrųjų prievadų, visada bus nuskaityti kiekvieno pagrindinio kompiuterio prašomi prievadai.
