text.configDetect=Προσπάθεια ανίχνευσης του αριθμού των διεργασιών οι οποίοι δουλεύουν σε πραγματικό χρόνο σε αυτό το μηχάνημα που συνδέεται για να μάθει πόσες φορές εξομοιώνεται στον υπολογιστή η χρήση ρυθμίσεων του χρονικού ορίου της θύρας.\n\nΠαρακαλώ ο προβαλλόμενος υπολογιστής και η θύρα αυτή είναι 100% ανοιχτή, π.χ. ένας υπολογιστής διαμεσολάβησης ή ο εξυπηρέτης ιστοσελίδων στο δίκτυο σου.
