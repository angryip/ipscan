preferences.fetchers.info=Εδώ μπορείτε να αλλάξετε τις προτιμήσεις, ειδικά για τους σηματοφορείς
preferences.ports.timing=Ρυθμός χρόνου
preferences.ports.timing.timeout=Χρονικό όριο σύνδεσης προεπιλεγμένης θύρας (σε ms):
